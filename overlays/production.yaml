overlay: 1.1.0
info:
  title: 开放平台接入说明与生产 API 服务器
  version: 1.0.0
actions:
  # 前言由文档仓库维护，接口参数、响应结构与鉴权定义继续来自线上规范。
  - target: $.info
    update:
      description: |

        # 快速开始

        接口统一使用以下地址，注意接口版本号前缀。

        ```text
        https://api.furrycons.cn/open
        ```

        # 获取令牌与鉴权

        注册并登录 [兽展日历工作台](https://dashboard.furrycons.cn)，在应用中心创建应用，获取您的应用访问令牌。

        调用接口时，在请求头中添加：

        ```http
        Authorization: Bearer <token>
        ```

        将 `<token>` 替换为你的应用访问令牌；请妥善保管应用令牌，不要将它提交到公开仓库。

        # 频率限制

        接口的频率限制为每分钟 600 次请求。超过限制后，服务器将返回 429 状态码，并携带 `X-RateLimit-Reset` 响应头，表示重试时间。请注意合理安排请求频率，避免因频率限制导致请求失败。


        # 友情提示

        * 我们的接口仍然处于积极开发中，可能会在不通知的情况下新增、修改或删除字段。请在接入时做好兼容处理。

        * 展会宣传图片可能较大，请根据实际需求缓存、裁剪并优化体积。

        * 使用旧版 `/event/recent` 接口的应用，请迁移至 `/open/event/recent`，携带应用令牌，并将旧参数 `keep_old` 改为 `keepOld`。具体行为与响应结构请查看「查询近期活动」。

        # 联系方式

        如果你在开发中有更多需求，欢迎进群戳我～👇👇👇

        点击加入 [兽展日历开放平台交流群](https://qm.qq.com/q/Q59CdSxP0S)，反馈问题、提出字段需求。

        # 目录导航

  # 后端生成的 spec 不含 servers，这里注入生产 API 地址，
  # 让 Try it 面板和代码示例拿到正确的 base URL。
  - target: $
    update:
      servers:
        - url: https://api.furrycons.cn
          description: 生产环境
